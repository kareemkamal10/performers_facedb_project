<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.19.0/dist/ort.min.js"></script>
</head>
<body>
<script type="module">
import { FaceLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

// ===== نفس الكود بالظبط الموجود في face_match_browser_mediapipe.html =====
const LEFT_EYE_IDXS = [33, 133, 159, 145];
const RIGHT_EYE_IDXS = [362, 263, 386, 374];
const NOSE_IDX = 1;
const MOUTH_LEFT_IDX = 61;
const MOUTH_RIGHT_IDX = 291;

const ARCFACE_TEMPLATE = [
  [38.2946, 51.6963],
  [73.5318, 51.5014],
  [56.0252, 71.7366],
  [41.5493, 92.3655],
  [70.7299, 92.2041],
];

let faceLandmarker = null;
let embedSession = null;

function meanPoint(landmarks, idxs, w, h) {
  let x = 0, y = 0;
  idxs.forEach(i => { x += landmarks[i].x * w; y += landmarks[i].y * h; });
  return [x / idxs.length, y / idxs.length];
}

function get5Points(landmarks, w, h) {
  const eyeA = meanPoint(landmarks, LEFT_EYE_IDXS, w, h);
  const eyeB = meanPoint(landmarks, RIGHT_EYE_IDXS, w, h);
  const [leftEye, rightEye] = eyeA[0] <= eyeB[0] ? [eyeA, eyeB] : [eyeB, eyeA];
  const nose = [landmarks[NOSE_IDX].x * w, landmarks[NOSE_IDX].y * h];
  const mA = [landmarks[MOUTH_LEFT_IDX].x * w, landmarks[MOUTH_LEFT_IDX].y * h];
  const mB = [landmarks[MOUTH_RIGHT_IDX].x * w, landmarks[MOUTH_RIGHT_IDX].y * h];
  const [leftMouth, rightMouth] = mA[0] <= mB[0] ? [mA, mB] : [mB, mA];
  return [leftEye, rightEye, nose, leftMouth, rightMouth];
}

function estimateSimilarityTransform(src, dst) {
  const n = src.length;
  let srcMeanX = 0, srcMeanY = 0, dstMeanX = 0, dstMeanY = 0;
  for (let i = 0; i < n; i++) {
    srcMeanX += src[i][0]; srcMeanY += src[i][1];
    dstMeanX += dst[i][0]; dstMeanY += dst[i][1];
  }
  srcMeanX /= n; srcMeanY /= n; dstMeanX /= n; dstMeanY /= n;

  let sxx = 0, sxy = 0, syx = 0, syy = 0, srcVar = 0;
  for (let i = 0; i < n; i++) {
    const sx = src[i][0] - srcMeanX, sy = src[i][1] - srcMeanY;
    const dx = dst[i][0] - dstMeanX, dy = dst[i][1] - dstMeanY;
    sxx += dx * sx; sxy += dx * sy;
    syx += dy * sx; syy += dy * sy;
    srcVar += sx * sx + sy * sy;
  }
  const a = (sxx + syy) / srcVar;
  const b = (syx - sxy) / srcVar;
  const scale = Math.sqrt(a * a + b * b);
  const angle = Math.atan2(b, a);
  const cos = Math.cos(angle) * scale, sin = Math.sin(angle) * scale;
  const tx = dstMeanX - (cos * srcMeanX - sin * srcMeanY);
  const ty = dstMeanY - (sin * srcMeanX + cos * srcMeanY);
  return [cos, sin, -sin, cos, tx, ty];
}

function alignFace(img, landmarks, w, h) {
  const canvas = document.createElement("canvas");
  canvas.width = 112;
  canvas.height = 112;
  const ctx = canvas.getContext("2d");
  const src5 = get5Points(landmarks, w, h);
  const [a, b, c, d, e, f] = estimateSimilarityTransform(src5, ARCFACE_TEMPLATE);
  ctx.setTransform(a, b, c, d, e, f);
  ctx.drawImage(img, 0, 0);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  return canvas;
}

function preprocess(canvas) {
  const ctx = canvas.getContext("2d");
  const imgData = ctx.getImageData(0, 0, 112, 112).data;
  const chw = new Float32Array(3 * 112 * 112);
  for (let i = 0; i < 112 * 112; i++) {
    const r = imgData[i * 4], g = imgData[i * 4 + 1], b = imgData[i * 4 + 2];
    chw[i] = (r - 127.5) / 127.5;
    chw[112 * 112 + i] = (g - 127.5) / 127.5;
    chw[2 * 112 * 112 + i] = (b - 127.5) / 127.5;
  }
  return new ort.Tensor("float32", chw, [1, 3, 112, 112]);
}

// دول الدالتين اللي سكريبت Node بينادي عليهم
window.initModels = async function (options) {
  options = options || {};
  const vision = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
  );
  faceLandmarker = await FaceLandmarker.createFromOptions(vision, {
    baseOptions: { modelAssetPath: "./face_landmarker.task" },
    runningMode: "IMAGE",
    numFaces: 1,
    minFaceDetectionConfidence: options.minFaceDetectionConfidence || 0.5,
    minFacePresenceConfidence: options.minFacePresenceConfidence || 0.5,
  });
  embedSession = await ort.InferenceSession.create("./w600k_mbf.onnx", {
    executionProviders: ["wasm"],
  });
  return true;
};

window.processImage = async function (dataUrl) {
  const img = await new Promise((resolve, reject) => {
    const image = new Image();
    image.onload = () => resolve(image);
    image.onerror = reject;
    image.src = dataUrl;
  });

  const result = faceLandmarker.detect(img);
  if (!result.faceLandmarks || result.faceLandmarks.length === 0) {
    return { ok: false };
  }

  const landmarks = result.faceLandmarks[0];
  const aligned = alignFace(img, landmarks, img.width, img.height);
  const tensor = preprocess(aligned);
  const feeds = {};
  feeds[embedSession.inputNames[0]] = tensor;
  const output = await embedSession.run(feeds);
  const emb = output[embedSession.outputNames[0]].data;

  let norm = 0;
  for (let i = 0; i < emb.length; i++) norm += emb[i] * emb[i];
  norm = Math.sqrt(norm);
  const normed = Array.from(emb).map((v) => v / norm);

  return { ok: true, embedding: normed };
};

// Recovery-mode variant: used only for the excluded.json follow-up pass.
// Tries the full image first (same as processImage), and if no face is
// found, retries on progressively tighter top-crops of the image - this is
// the fix for full-body shots where the face is clear to a human but too
// small, relative to the whole frame, for the detector's default confidence
// threshold (also lowered separately, via initModels' options, for this pass).
window.processImageRecovery = async function (dataUrl) {
  const img = await new Promise((resolve, reject) => {
    const image = new Image();
    image.onload = () => resolve(image);
    image.onerror = reject;
    image.src = dataUrl;
  });

  const attempts = [{ source: img, w: img.width, h: img.height }];

  // Small-but-not-top-anchored faces (e.g. a torso-up mirror selfie where
  // the face just isn't very large in frame): re-feeding the detector a
  // larger version sometimes recovers these without guessing where the
  // face sits in the frame.
  for (const factor of [1.5, 2.0]) {
    const canvas = document.createElement("canvas");
    canvas.width = Math.round(img.width * factor);
    canvas.height = Math.round(img.height * factor);
    const ctx = canvas.getContext("2d");
    ctx.imageSmoothingQuality = "high";
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    attempts.push({ source: canvas, w: canvas.width, h: canvas.height });
  }

  // Full-body shots specifically: the face sits in the top portion of the
  // frame, so a tighter top-crop makes it relatively larger.
  for (const fraction of [0.5, 0.33, 0.22]) {
    const cropH = Math.max(1, Math.round(img.height * fraction));
    const canvas = document.createElement("canvas");
    canvas.width = img.width;
    canvas.height = cropH;
    canvas
      .getContext("2d")
      .drawImage(img, 0, 0, img.width, cropH, 0, 0, img.width, cropH);
    attempts.push({ source: canvas, w: img.width, h: cropH });
  }

  for (const attempt of attempts) {
    const result = faceLandmarker.detect(attempt.source);
    if (result.faceLandmarks && result.faceLandmarks.length > 0) {
      const landmarks = result.faceLandmarks[0];
      const aligned = alignFace(attempt.source, landmarks, attempt.w, attempt.h);
      const tensor = preprocess(aligned);
      const feeds = {};
      feeds[embedSession.inputNames[0]] = tensor;
      const output = await embedSession.run(feeds);
      const emb = output[embedSession.outputNames[0]].data;

      let norm = 0;
      for (let i = 0; i < emb.length; i++) norm += emb[i] * emb[i];
      norm = Math.sqrt(norm);
      const normed = Array.from(emb).map((v) => v / norm);

      return { ok: true, embedding: normed };
    }
  }
  return { ok: false };
};
</script>
</body>
</html>
